<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de Login | LokaFest</title>
  <meta name="theme-color" content="#6B21A8">
  <link rel="manifest" href="/manifest.webmanifest?v=8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/lokafest/favicon-32x32.png?v=8">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/lokafest/favicon-16x16.png?v=8">
  <link rel="shortcut icon" href="/favicon.ico?v=8">
<link rel="stylesheet" href="/static/lokafest/lokafest.css">
<style>
.diagbox{max-width:760px;margin:40px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.diagitem{padding:14px 16px;margin:10px 0;border:1px solid #ddd;border-radius:12px;background:#fafafa}
.diagitem.ok{border-left:6px solid #17883e}.diagitem.erro{border-left:6px solid #c62828}
.diagcode{font-weight:900;margin-bottom:5px}.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.acoes a{text-decoration:none}
</style>
</head>
<body class="auth">
<div class="diagbox">
<img src="/static/lokafest/logo.png" alt="LokaFest" style="max-width:180px">
<h1>Diagnóstico do login</h1>
<p>Resultado real das etapas executadas em produção.</p>
{% for codigo, ok, mensagem in etapas %}
<div class="diagitem {{ 'ok' if ok else 'erro' }}">
<div class="diagcode">{{ 'OK' if ok else 'ERRO' }} — {{ codigo }}</div>
<div>{{ mensagem }}</div>
</div>
{% endfor %}
<div class="acoes">
{% if sucesso %}<a class="btn primary" href="/painel">Abrir painel</a>{% endif %}
<a class="btn" href="/entrar">Voltar ao login</a>
</div>
</div>
</body>
</html>
