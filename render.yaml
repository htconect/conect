services:
  - type: web
    name: humiat-conect
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CONECT_ADMIN_NOME
        value: Admin
      - key: CONECT_ADMIN_SENHA
        value: humiat123

      - key: INFINITEPAY_HANDLE
        value: karaokerj
      - key: INFINITEPAY_TIMEOUT_SECONDS
        value: "15"

      - key: PERFORMANCE_MONITORING
        value: "true"
      - key: PERFORMANCE_DETAIL
        value: slow
      - key: PERFORMANCE_ROUTES
        value: /painel
      - key: PERFORMANCE_SLOW_REQUEST_MS
        value: "500"
      - key: PERFORMANCE_SLOW_SQL_MS
        value: "300"
