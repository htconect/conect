<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar | LokaFest</title>
  <meta name="theme-color" content="#6B21A8">
  <link rel="manifest" href="/manifest.webmanifest?v=8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/lokafest/favicon-32x32.png?v=8">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/lokafest/favicon-16x16.png?v=8">
  <link rel="shortcut icon" href="/favicon.ico?v=8">
  <link rel="stylesheet" href="/static/lokafest/lokafest.css?v={{ app_version }}">
</head>
<body class="auth">
  <div class="loginbox">
    <a href="/"><img src="/static/lokafest/logo.png" alt="LokaFest"></a>
    <form method="post" action="/entrar">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <h1>Entrar</h1>
      <p>Acesse sua área de indicações usando seu CPF ou WhatsApp.</p>
      {% if erro %}<div class="alert error">{{ erro }}</div>{% endif %}
      <label>CPF ou WhatsApp
        <input name="identificador" required inputmode="numeric" autofocus autocomplete="username" placeholder="Digite seu CPF ou WhatsApp">
      </label>
      <label>Senha
        <input type="password" name="senha" required autocomplete="current-password">
      </label>
      <button class="btn primary full" type="submit">Entrar</button>
      <div style="text-align:center;margin-top:14px"><a href="/esqueci-senha" style="font-weight:800;color:#075fbd;text-decoration:none">Esqueci minha senha</a></div>
      <div style="text-align:center;margin-top:10px;font-size:11px;color:#8a94a6">Acesso por CPF ou WhatsApp · versão {{ app_version }}</div>
    </form>
  </div>
</body>
</html>
