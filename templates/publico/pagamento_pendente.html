{% extends "base.html" %}
{% block conteudo %}
<div class="box" style="max-width:720px;margin:24px auto;text-align:center;padding:28px;">
  <p class="mini">Contrato #{{ item.id }}</p>
  <h1>Confirmando seu pagamento</h1>
