<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recuperar senha | LokaFest</title>
  <meta name="theme-color" content="#6B21A8">
  <link rel="manifest" href="/manifest.webmanifest?v=8">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=8">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/lokafest/favicon-32x32.png?v=8">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/lokafest/favicon-16x16.png?v=8">
  <link rel="shortcut icon" href="/favicon.ico?v=8">
  <link rel="stylesheet" href="/static/lokafest/lokafest.css?v={{ app_version }}">
</head>
<body class="auth">
  <div class="loginbox">
    <a href="/"><img src="/static/lokafest/logo.png" alt="LokaFest"></a>
    <form method="post">
      <div style="font-size:12px;font-weight:900;color:#ff6a00;letter-spacing:.08em;text-transform:uppercase">Recuperação de acesso</div>
      <h1>Esqueci minha senha</h1>
      <p>Informe seu CPF e o WhatsApp exatamente como estão cadastrados.</p>
      {% if erro %}<div class="alert error">{{ erro }}</div>{% endif %}
      <label>CPF<input name="cpf" required inputmode="numeric" placeholder="000.000.000-00" autofocus></label>
      <label>WhatsApp cadastrado<input name="whatsapp" required inputmode="tel" placeholder="(21) 99999-9999"></label>
      <button class="btn primary full">Continuar</button>
      <div style="text-align:center;margin-top:14px"><a href="/entrar" style="font-weight:800;color:#075fbd;text-decoration:none">Voltar para entrar</a></div>
    </form>
  </div>
</body>
</html>
